<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作台</title><link rel="stylesheet" href="/portal.css"><script src="/auth.js" defer></script><script src="/portal.js" defer></script></head><body>
<header><a class="brand" href="/">◈ 工作台</a><nav><a id="auth-manage" href="/login" hidden>通行密钥</a><button id="auth-logout" hidden>退出登录</button></nav></header>
<main><div class="intro"><p class="eyebrow">PRIVATE WORKSPACE</p><h1>一个入口，各有所归。</h1><p class="subtitle">打开你已配置的应用。</p><span id="access-state" class="access">正在确认登录状态</span></div><section class="apps">{{range .}}<a id="{{.ID}}-link" class="app-card ready" href="/apps/{{.ID}}/"><div class="card-top"><span class="icon">◇</span><span class="badge">可使用</span></div><h3>{{.Title}}</h3><p>{{.Description}}</p><div class="card-bottom"><span>打开</span><span>↗</span></div></a>{{end}}</section><p id="portal-message" role="status"></p><footer>你的工作空间。</footer></main></body></html>
