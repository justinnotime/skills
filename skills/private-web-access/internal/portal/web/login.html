<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作台 · 安全登录</title><link rel="stylesheet" href="/style.css"><script src="/auth.js" defer></script></head>
<body><header><a class="brand" href="/">◈ 工作台</a></header><main class="auth-panel"><p class="eyebrow">PASSKEY</p><h1>用你的通行密钥登录。</h1><p id="auth-description">正在确认登录状态…</p><div class="auth-actions"><button id="auth-login" class="primary">使用通行密钥登录</button><button id="auth-register" class="primary" hidden>在此设备创建通行密钥</button><a id="auth-back" href="/" hidden>返回工作台</a><button id="auth-logout-all" class="secondary" hidden>退出所有浏览器</button></div><p id="auth-message" aria-live="polite"></p><div id="auth-credentials"></div><p class="subtitle">每个凭据拥有相同的所有者权限，可登记最多 8 个。指纹、面容或设备 PIN 由你的设备验证。</p></main></body></html>
