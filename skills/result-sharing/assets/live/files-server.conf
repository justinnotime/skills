server {
        listen 8081;
        absolute_redirect off;
        server_name 127.0.0.1 localhost;
        auth_basic_user_file /etc/nginx/results.htpasswd;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Cache-Control no-store always;
        # Only reviewed read operations. Account, token, sharing and admin APIs are absent.
        location ~ ^/api/(users|resources|resources/items|resources/download|resources/preview|settings/sources|tools/search)$ {
            include /etc/nginx/files-proxy.conf;
        }
        location ^~ /public/static/ {
            include /etc/nginx/files-proxy.conf;
        }
        location = /api/resources/download {
            add_header Cache-Control no-store always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
            include /etc/nginx/files-proxy.conf;
        }
        location ~ ^/(api|public|swagger|health|login)(/|$) { return 403; }
        location ~ ^/(files|static)(/|$) {
            include /etc/nginx/files-proxy.conf;
        }
        location ~ ^/(favicon.ico|manifest.json|robots.txt)$ {
            include /etc/nginx/files-proxy.conf;
        }
        # Keep previously supplied paths usable; Quantum uses /files/<source>/ paths.
        location / { rewrite ^/(.*)$ /files/ops/$1 redirect; }
    }
