[project]
name = "fleet-orchestrator"
version = "0.2.0"
description = "Standalone fleet task tracking, durable messaging, and terminal coordination"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["skills-ref", "pytest", "ruff"]

[tool.uv]
package = false

[tool.uv.sources]
skills-ref = { git = "https://github.com/agentskills/agentskills.git", rev = "69ef37e9424c0a7ea9dd2293b559e43ec8176379", subdirectory = "skills-ref" }

[tool.ruff]
extend-include = ["scripts/orc"]
