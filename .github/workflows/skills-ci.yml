name: Skill CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  codex-cost:
    name: codex-cost / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.30"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Test isolated plugin
        env:
          TEST_PYTHON: ${{ matrix.python }}
        run: |
          cp -a "$GITHUB_WORKSPACE/plugins/codex-cost" "$RUNNER_TEMP/codex-cost"
          cd "$RUNNER_TEMP/codex-cost"
          uv run --no-project --python "$TEST_PYTHON" python -B -m unittest discover -s tests -v
  skill:
    name: ${{ matrix.skill }} / ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: agent-harness-integration
            kind: instruction
            python: "3.14"
            check: Skill format
          - skill: agent-bus
            kind: instruction
            python: "3.14"
            check: Skill format
          - skill: fleet-orchestrator
            kind: python
            python: "3.11"
            check: Python 3.11
          - skill: fleet-orchestrator
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: repository-publish
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: repository-publish
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: genteam
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: genteam
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: google-docs-authority
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: google-docs-authority
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: genspark-archive
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: genspark-archive
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: prompt-translation
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: prompt-translation
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: document-facts
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: document-facts
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: activity-summary
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: activity-summary
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: markdown-issues
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: markdown-issues
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: runtime-install
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: runtime-install
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: runtime-layout
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: runtime-layout
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: workspace-brief
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: workspace-brief
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: structure-lint
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: structure-lint
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: chat-mentions
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: chat-mentions
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: teams-send
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: teams-send
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: chat-draft
            kind: instruction
            python: "3.14"
            check: Skill format
          - skill: secret-lint
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: secret-lint
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: privacy-lint
            kind: instruction
            python: "3.14"
            check: Skill format
          - skill: pr-status-table
            kind: instruction
            python: "3.14"
            check: Skill format
          - skill: realign
            kind: instruction
            python: "3.14"
            check: Skill format
          - skill: draft-human-reply
            kind: instruction
            python: "3.14"
            check: Skill format
          - skill: cross-ref-lint
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: cross-ref-lint
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: happy-tmux-title
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: happy-tmux-title
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: google-chat-archive
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: google-chat-archive
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: matrix-bridge
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: matrix-bridge
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: slack-archive
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: slack-archive
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: github-archive
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: github-archive
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: teams-archive
            kind: python
            python: "3.10"
            check: Python 3.10
          - skill: teams-archive
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: whatsapp-archive
            kind: python
            python: "3.10"
            check: Python 3.10 and bridge
          - skill: whatsapp-archive
            kind: python
            python: "3.14"
            check: Python 3.14 and bridge
          - skill: agent-session-extraction
            kind: python
            python: "3.11"
            check: Python 3.11
          - skill: agent-session-extraction
            kind: python
            python: "3.14"
            check: Python 3.14
          - skill: state-backup
            kind: shell
            check: backup tests
          - skill: agent-harness-profiles
            kind: shell
            check: installation tests
          - skill: remote-clipboard
            kind: syntax
            check: shell syntax only
          - skill: syncthing-doctor
            kind: syntax
            check: shell syntax only
    env:
      SKILL: ${{ matrix.skill }}
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy only this Skill
        run: |
          mkdir -p "$RUNNER_TEMP/skill-check"
          cp -a "$GITHUB_WORKSPACE/skills/$SKILL" "$RUNNER_TEMP/skill-check/$SKILL"
      - name: Set up uv and Python
        if: matrix.kind == 'python' || matrix.kind == 'instruction'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.30"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install test command dependencies
        if: matrix.kind == 'shell' || matrix.skill == 'agent-session-extraction' || matrix.skill == 'happy-tmux-title' || matrix.skill == 'fleet-orchestrator' || matrix.skill == 'repository-publish' || matrix.skill == 'google-docs-authority'
        run: |
          case "$SKILL" in
            agent-session-extraction) packages=(git-crypt) ;;
            happy-tmux-title) packages=(tmux) ;;
            fleet-orchestrator) packages=(tmux jq iproute2) ;;
            repository-publish) packages=(git-lfs) ;;
            google-docs-authority) packages=(pandoc poppler-utils git-lfs) ;;
            state-backup|agent-harness-profiles) packages=(rsync sqlite3) ;;
          esac
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Set up Node for native plugin behavior tests
        if: matrix.skill == 'fleet-orchestrator'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.16.0"
      - name: Run Python package tests
        if: matrix.kind == 'python'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv sync --locked --all-extras
          uv run --no-sync pytest tests -q -rs
      - name: Validate instruction-only Skill
        if: matrix.kind == 'instruction'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: uv run --locked skills-ref validate "$PWD"
      - name: Run shell package tests
        if: matrix.kind == 'shell'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          bash tests/run.sh
          if [[ "$SKILL" == state-backup ]]; then
            python3 -B -m unittest discover -s tests -v
          fi
      - name: Lint session extraction entry point
        if: matrix.skill == 'agent-session-extraction'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check src tests --select E9,F63,F7,F82
          uv run --no-sync ruff check src/agent_skills/sessions/scheduled.py tests/test_scheduled.py --select E4,E7,E9,F
          sh -n scripts/run
      - name: Check complete fleet runtime
        if: matrix.skill == 'fleet-orchestrator'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check scripts tests --select E9,F63,F7,F82
          uv run --no-sync skills-ref validate "$PWD"
          bash tests/test-dispatch-ledger-guards.sh
          bash tests/test-tview.sh
          bash tests/test-tview-regression.sh
          bash tests/test-fleet-staging.sh
          bash tests/test-agent-boot-harness.sh
          bash tests/test-agent-boot-restart-guard.sh
          bash tests/test-agent-bus-cli.sh
          bash tests/test-fleet-lint.sh
          bash tests/test-claude-statusline-orc.sh
          uv run --no-sync python scripts/merge-receipt.py --self-test
          uv run --no-sync python scripts/pr-green-unreviewed.py --self-test
          uv run --no-sync python scripts/pr-red-triage.py --self-test
      - name: Check portable runtime packages
        if: matrix.skill == 'repository-publish' || matrix.skill == 'secret-lint' || matrix.skill == 'structure-lint' || matrix.skill == 'genteam'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check src tests --select E9,F63,F7,F82
          if [[ "${{ matrix.python }}" != "3.10" ]]; then
            uv run --no-sync skills-ref validate "$PWD"
          fi
      - name: Lint Teams entry point
        if: matrix.skill == 'teams-archive'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check src tests --select E9,F63,F7,F82
          uv run --no-sync ruff check tests/test_publication.py --select E4,E7,E9,F
          bash -n scripts/sync
      - name: Check configured local runtime tools
        if: matrix.skill == 'runtime-install' || matrix.skill == 'runtime-layout' || matrix.skill == 'workspace-brief'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check src tests
          if [[ "${{ matrix.python }}" != "3.10" ]]; then
            if [[ "$SKILL" == "runtime-layout" ]]; then
              uv run --no-sync skills-ref validate "$PWD"
            else
              uv run --no-sync agentskills validate "$PWD"
            fi
          fi
      - name: Lint Google Docs authority
        if: matrix.skill == 'google-docs-authority'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          sh -n scripts/publish
          sh -n scripts/registry
          sh -n scripts/fingerprint
          sh -n scripts/sync scripts/auth scripts/render scripts/compare-exports
          uv run --no-sync gdocs-sync --self-test
      - name: Lint Genspark archive
        if: matrix.skill == 'genspark-archive'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          sh -n scripts/sync-emails scripts/sync-calendar scripts/sync-meetings
          if [[ "${{ matrix.python }}" != "3.10" ]]; then
            uv run --no-sync agentskills validate "$PWD"
          fi
      - name: Lint content pipelines
        if: matrix.skill == 'prompt-translation' || matrix.skill == 'document-facts' || matrix.skill == 'activity-summary'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          case "$SKILL" in
            prompt-translation) sh -n scripts/translate scripts/validate scripts/run ;;
            document-facts) sh -n scripts/extract ;;
            activity-summary) sh -n scripts/extract-facts scripts/render-issue-section scripts/eval-facts scripts/validate-daily scripts/validate-weekly scripts/run-daily scripts/run-weekly ;;
          esac
          if [[ "${{ matrix.python }}" != "3.10" ]]; then
            uv run --no-sync agentskills validate "$PWD"
          fi
      - name: Lint GitHub graph tools
        if: matrix.skill == 'github-archive'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check src/issue_graph.py tests/test_graph.py
          uv run --no-sync ruff format --check src/issue_graph.py tests/test_graph.py
          bash -n scripts/sync
          sh -n scripts/graph
          if [[ "${{ matrix.python }}" != "3.10" ]]; then
            uv run --no-sync agentskills validate "$PWD"
          fi
      - name: Lint Markdown issue tracker
        if: matrix.skill == 'markdown-issues'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          sh -n scripts/issues
          if [[ "${{ matrix.python }}" != "3.10" ]]; then
            uv run --no-sync agentskills validate "$PWD"
          fi
      - name: Lint chat mentions
        if: matrix.skill == 'chat-mentions'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          sh -n scripts/mentions
      - name: Lint Teams sender
        if: matrix.skill == 'teams-send'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          sh -n scripts/send
      - name: Lint Matrix bridge
        if: matrix.skill == 'matrix-bridge'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: uv run --no-sync ruff check src tests mx-send mx-recv --select E4,E7,E9,F
      - name: Lint Google Chat archive
        if: matrix.skill == 'google-chat-archive'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check src tests --select E4,E7,E9,F
          sh -n scripts/sync
      - name: Lint Happy tmux title
        if: matrix.skill == 'happy-tmux-title'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check src tests --select E4,E7,E9,F
          sh -n scripts/window-index
      - name: Lint cross-reference checker
        if: matrix.skill == 'cross-ref-lint'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check src tests --select E4,E7,E9,F
          sh -n scripts/check
      - name: Check WhatsApp archive and bridge
        if: matrix.skill == 'whatsapp-archive'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          uv run --no-sync ruff check src tests --select E4,E7,E9,F
          bash -n scripts/sync
          node --check bridge/bridge.js
          npm ci --prefix bridge --no-audit --no-fund
          npm test --prefix bridge
          store=$(mktemp -d)
          WA_BRIDGE_DIR="$store" node bridge/bridge.js status
          test -z "$(ls -A "$store")"
      - name: Check shell syntax
        if: matrix.kind == 'syntax'
        working-directory: ${{ runner.temp }}/skill-check/${{ matrix.skill }}
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -print0)
